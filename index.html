<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodewro</title>
  <style>
    :root {
      color-scheme: dark;
      --accent: #4ee8dc;
      --accent-strong: #20c7bd;
      --text: rgba(255, 255, 255, 0.96);
      --muted: rgba(255, 255, 255, 0.62);
      --line: rgba(255, 255, 255, 0.16);
      --panel: rgba(9, 12, 18, 0.58);
      --panel-strong: rgba(10, 12, 18, 0.74);
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.58);
      --app-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      --timer-font: var(--app-font);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 16px;
      background:
        radial-gradient(circle at 12% 12%, rgba(78, 232, 220, 0.18), transparent 30%),
        radial-gradient(circle at 84% 20%, rgba(129, 140, 248, 0.16), transparent 28%),
        #050711;
      color: var(--text);
      font-family: var(--app-font);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: 0.56;
    }

    select,
    input[type="number"] {
      width: 100%;
      min-width: 0;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9px;
      background: rgba(5, 8, 14, 0.58);
      color: var(--text);
      outline: none;
    }

    select {
      height: 34px;
      padding: 0 10px;
    }

    input[type="number"] {
      height: 30px;
      padding: 0 8px;
      text-align: center;
      font-weight: 700;
      appearance: textfield;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      margin: 0;
      appearance: none;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    select:focus,
    input:focus,
    button:focus-visible {
      outline: 2px solid rgba(78, 232, 220, 0.72);
      outline-offset: 2px;
    }

    select option {
      color: #101827;
    }

    .shell {
      width: min(96vw, 750px);
      height: min(58vw, 438px);
      min-height: 392px;
      max-height: 438px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 9px;
      background-image: var(--background-image);
      background-position: center;
      background-size: cover;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      isolation: isolate;
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 18% 20%, rgba(78, 232, 220, 0.28), transparent 24%),
        linear-gradient(145deg, #17233a 0%, #3a2032 42%, #06111f 100%);
    }

    .tint {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: rgba(0, 0, 0, var(--tint, 0.58));
      transition: background 180ms ease;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 292px;
      height: 100%;
      transition: grid-template-columns 260ms ease;
    }

    .app.focus-mode {
      grid-template-columns: minmax(0, 1fr) 0;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      gap: 9px;
      padding: 20px 22px 14px;
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      background: linear-gradient(90deg, rgba(6, 9, 18, 0.18), rgba(6, 9, 18, 0.03));
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }

    .settings {
      position: relative;
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(9, 11, 17, 0.66);
      -webkit-backdrop-filter: blur(24px) saturate(1.15);
      backdrop-filter: blur(24px) saturate(1.15);
      transition: opacity 220ms ease, transform 260ms ease;
    }

    .settings::before {
      content: "";
      position: absolute;
      top: -13px;
      left: 108px;
      width: 28px;
      height: 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.24);
      border-left: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(9, 11, 17, 0.76);
      transform: rotate(45deg);
    }

    .app.focus-mode .settings {
      opacity: 0;
      pointer-events: none;
      transform: translateX(18px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .tomato {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 50%;
      border: 1px solid rgba(78, 232, 220, 0.72);
      background: rgba(6, 11, 18, 0.3);
      box-shadow: 0 0 24px rgba(78, 232, 220, 0.18);
    }

    .tomato svg {
      transform: translate(-0.5px, -1px);
    }

    h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 760;
      letter-spacing: 0;
      line-height: 1.05;
    }

    .settings-toggle {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    .settings-toggle:hover,
    .icon-round:hover,
    .mode-pill:hover,
    .add-button:hover,
    .step-button:hover {
      transform: translateY(-1px);
      border-color: rgba(78, 232, 220, 0.42);
      background: rgba(78, 232, 220, 0.12);
    }

    .settings-toggle.active {
      color: #062c2b;
      border-color: rgba(78, 232, 220, 0.8);
      background: linear-gradient(135deg, rgba(78, 232, 220, 0.94), rgba(32, 199, 189, 0.74));
    }

    .mode-switch {
      width: min(100%, 330px);
      justify-self: center;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-top: 7px;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: rgba(11, 11, 19, 0.56);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }

    .mode-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 28px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      font-weight: 740;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    .mode-pill.active {
      color: #eaffff;
      border-color: rgba(78, 232, 220, 0.24);
      background: rgba(78, 232, 220, 0.28);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .timer-zone {
      align-self: stretch;
      display: grid;
      align-content: center;
      gap: 18px;
    }

    .timer {
      font-family: var(--timer-font);
      font-variant-numeric: tabular-nums;
      font-size: clamp(78px, 11vw, 96px);
      font-weight: 500;
      line-height: 0.92;
      letter-spacing: 0;
      text-align: center;
      text-shadow: 0 4px 32px rgba(0, 0, 0, 0.62);
    }

    .progress-wrap {
      display: grid;
      gap: 6px;
    }

    .progress-track {
      height: 11px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      box-shadow: inset 0 1px 8px rgba(0, 0, 0, 0.38);
    }

    .progress-fill {
      width: var(--progress, 100%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(78, 232, 220, 0.95), rgba(106, 255, 231, 0.82));
      box-shadow: 0 0 22px rgba(78, 232, 220, 0.34);
      transition: width 320ms linear;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .control-row {
      display: flex;
      justify-content: center;
      gap: 26px;
      margin-bottom: 12px;
    }

    .control-item {
      display: grid;
      justify-items: center;
      gap: 8px;
      min-width: 56px;
      background: transparent;
    }

    .icon-round {
      display: grid;
      place-items: center;
      width: 56px;
      height: 54px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      background: rgba(9, 11, 18, 0.5);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    .control-item.primary .icon-round {
      color: #073331;
      border: 0;
      background: linear-gradient(135deg, rgba(96, 255, 235, 1), rgba(53, 212, 202, 0.9));
      box-shadow: 0 16px 38px rgba(53, 212, 202, 0.26);
    }

    .control-label {
      color: rgba(255, 255, 255, 0.78);
      font-size: 12px;
      font-weight: 620;
    }

    .cycle-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: min(100%, 376px);
      justify-self: center;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      background: rgba(12, 16, 24, 0.48);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }

    .cycle-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .cycle-title {
      margin: 0;
      font-size: 13px;
      font-weight: 720;
    }

    .cycle-subtitle {
      margin: 2px 0 0;
      color: rgba(255, 255, 255, 0.62);
      font-size: 10px;
      white-space: nowrap;
    }

    .switch {
      position: relative;
      width: 38px;
      height: 22px;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      padding: 2px;
    }

    .switch::after {
      content: "";
      display: block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.36);
      transition: transform 180ms ease;
    }

    .switch.on {
      border-color: rgba(78, 232, 220, 0.72);
      background: rgba(78, 232, 220, 0.64);
    }

    .switch.on::after {
      transform: translateX(16px);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      min-height: 62px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .tab {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 5px;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: rgba(255, 255, 255, 0.62);
      font-size: 10px;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: rgba(78, 232, 220, 0.62);
    }

    .settings-body {
      min-height: 0;
      overflow-y: auto;
      padding: 10px 14px 12px;
      scrollbar-width: thin;
      scrollbar-color: rgba(78, 232, 220, 0.42) rgba(255, 255, 255, 0.08);
    }

    .tab-page {
      display: none;
    }

    .tab-page.active {
      display: block;
    }

    #historyPage.active {
      height: 100%;
    }

    .section {
      display: grid;
      gap: 7px;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .section:last-child {
      border-bottom: 0;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .section-title {
      margin: 0;
      font-size: 14px;
      font-weight: 760;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .field label {
      color: rgba(255, 255, 255, 0.68);
      font-size: 11px;
      font-weight: 650;
    }

    .stepper {
      display: grid;
      grid-template-columns: 28px 1fr 28px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
    }

    .stepper input {
      border: 0;
      border-inline: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 0;
      background: rgba(255, 255, 255, 0.03);
    }

    .step-button {
      display: grid;
      place-items: center;
      min-height: 30px;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.82);
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    .sound-row,
    .background-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 92px;
      gap: 9px;
      align-items: end;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .add-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 34px;
      border: 1px solid rgba(78, 232, 220, 0.28);
      border-radius: 8px;
      background: rgba(78, 232, 220, 0.08);
      color: var(--accent);
      font-size: 11px;
      font-weight: 720;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
      white-space: nowrap;
    }

    .section > .add-button {
      width: 100%;
    }

    .tip {
      margin: 0;
      color: rgba(255, 255, 255, 0.48);
      font-size: 10px;
      line-height: 1.4;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-card {
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.07);
    }

    .stat-value {
      margin: 0;
      color: var(--accent);
      font-size: 20px;
      font-weight: 780;
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      margin: 2px 0 0;
      color: rgba(255, 255, 255, 0.58);
      font-size: 10px;
      white-space: nowrap;
    }

    .history-list {
      display: grid;
      gap: 6px;
      max-height: 130px;
      overflow-y: auto;
      padding-right: 2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(78, 232, 220, 0.42) rgba(255, 255, 255, 0.08);
    }

    #historySection {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    #historySection .action-row {
      margin-top: auto;
    }

    .history-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 7px 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
    }

    .history-day {
      min-width: 0;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.86);
      font-size: 11px;
      font-weight: 720;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-meta {
      color: rgba(255, 255, 255, 0.58);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .hidden-input {
      display: none;
    }

    .toast-stack {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 10;
      display: grid;
      gap: 8px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .toast {
      min-width: 160px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 9px 13px;
      background: rgba(8, 13, 24, 0.82);
      color: rgba(255, 255, 255, 0.93);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.32);
      font-size: 12px;
      text-align: center;
      animation: toast-in 220ms ease both;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 8px;
      }

      .shell {
        width: 100vw;
        height: auto;
        min-height: 410px;
      }
    }
  </style>
</head>
<body>
  <main class="shell" id="shell" style="--progress: 100%; --tint: 0.58;">
    <div class="tint" aria-hidden="true"></div>
    <section class="app" id="app" aria-label="Pomodewro timer">
      <div class="main">
        <header class="topbar">
          <div class="brand">
            <div class="tomato" aria-hidden="true">
              <svg width="23" height="23" viewBox="0 0 24 24" fill="none">
                <path d="M12 7.2c5.1 0 8.1 3 8.1 7.1 0 4.1-3.2 6.8-8.1 6.8s-8.1-2.7-8.1-6.8c0-4.1 3-7.1 8.1-7.1Z" fill="#4ee8dc"/>
                <path d="M12.2 7.5c-.5-2.6 1.1-4.2 3.8-4.7-.2 2.5-1.4 4.3-3.8 4.7Z" fill="#a7f3d0"/>
                <path d="M11.9 7.5C10.6 5.4 8.7 5 6.5 5.8c1.5 1.8 3.1 2.4 5.4 1.7Z" fill="#5eead4"/>
              </svg>
            </div>
            <div>
              <h1>Pomodewro</h1>
            </div>
          </div>
          <button class="settings-toggle" id="settingsButton" type="button" aria-label="Toggle settings" title="Settings">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 15.4a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8Z" stroke="currentColor" stroke-width="2"/>
              <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a1.9 1.9 0 0 1-2.7 2.7l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a1.9 1.9 0 0 1-3.8 0v-.2a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a1.9 1.9 0 0 1-2.7-2.7l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a1.9 1.9 0 0 1 0-3.8h.2a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a1.9 1.9 0 0 1 2.7-2.7l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5V3a1.9 1.9 0 0 1 3.8 0v.2a1.6 1.6 0 0 0 1 1.5h.1a1.6 1.6 0 0 0 1.8-.3l.1-.1a1.9 1.9 0 0 1 2.7 2.7l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1h.2a1.9 1.9 0 0 1 0 3.8h-.2a1.6 1.6 0 0 0-1.5 1Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </header>

        <div class="mode-switch" aria-label="Timer mode">
          <button class="mode-pill active" id="focusModeButton" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="2"/><path d="M12 8v4l2.5 2.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Focus
          </button>
          <button class="mode-pill" id="breakModeButton" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 9h10l-1.1 7.5A2.9 2.9 0 0 1 13 19h-2a2.9 2.9 0 0 1-2.9-2.5L7 9Z" stroke="currentColor" stroke-width="2"/><path d="M8 5h8M18 10h1a2 2 0 0 1 0 4h-1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Break
          </button>
        </div>

        <div class="timer-zone" aria-live="polite">
          <div class="timer" id="timerDisplay">25:00</div>
          <div class="progress-wrap">
            <div class="progress-track"><div class="progress-fill"></div></div>
            <div class="progress-labels">
              <span>0:00</span>
              <span id="durationLabel">25:00</span>
            </div>
          </div>
        </div>

        <div class="control-row">
          <button class="control-item primary" id="playButton" type="button" aria-label="Play" title="Play">
            <span class="icon-round"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.8v12.4c0 .8.9 1.3 1.6.9l9.4-6.2c.6-.4.6-1.3 0-1.8L9.6 4.9C8.9 4.5 8 5 8 5.8Z"/></svg></span>
            <span class="control-label">Play</span>
          </button>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <input class="hidden-input" id="soundInput" type="file" accept="audio/*">
  <input class="hidden-input" id="backgroundInput" type="file" accept="image/*">

  <script>
    (() => {
      const MAX_FILE_SIZE = 2 * 1024 * 1024;
      const STORAGE_KEY = "macPomodoroState.v1";
      const DEFAULT_BACKGROUND = 'url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 1600 900%27%3E%3Cdefs%3E%3ClinearGradient id=%27sky%27 x1=%270%27 x2=%270%27 y1=%270%27 y2=%271%27%3E%3Cstop stop-color=%27%2313223f%27/%3E%3Cstop offset=%270.42%27 stop-color=%27%23412838%27/%3E%3Cstop offset=%271%27 stop-color=%27%23040b13%27/%3E%3C/linearGradient%3E%3ClinearGradient id=%27lake%27 x1=%270%27 x2=%270%27 y1=%270%27 y2=%271%27%3E%3Cstop stop-color=%27%232e5361%27/%3E%3Cstop offset=%271%27 stop-color=%27%2308131b%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%271600%27 height=%27900%27 fill=%27url(%23sky)%27/%3E%3Ccircle cx=%27845%27 cy=%27325%27 r=%27210%27 fill=%27%23f4ad82%27 opacity=%27.34%27/%3E%3Cpath d=%27M0 560 210 250l180 245 170-190 230 255 160-205 280 260 150-160 220 205v240H0Z%27 fill=%27%23070d15%27 opacity=%27.88%27/%3E%3Cpath d=%27M0 640h1600v260H0z%27 fill=%27url(%23lake)%27 opacity=%27.9%27/%3E%3Cpath d=%27M520 900c130-150 350-226 552-260 188-32 352-16 528 8v252Z%27 fill=%27%2304090e%27 opacity=%27.64%27/%3E%3Cpath d=%27M0 724c210-58 404-72 598-35 184 35 322 111 480 158H0Z%27 fill=%27%23050b12%27 opacity=%27.68%27/%3E%3C/svg%3E")';

      const elements = {
        shell: document.getElementById("shell"),
        app: document.getElementById("app"),
        settingsPanel: document.getElementById("settingsPanel"),
        settingsBody: document.getElementById("settingsBody"),
        settingsButton: document.getElementById("settingsButton"),
        timerDisplay: document.getElementById("timerDisplay"),
        durationLabel: document.getElementById("durationLabel"),
        focusModeButton: document.getElementById("focusModeButton"),
        breakModeButton: document.getElementById("breakModeButton"),
        playButton: document.getElementById("playButton"),
        pauseButton: document.getElementById("pauseButton"),
        resetButton: document.getElementById("resetButton"),
        cycleToggle: document.getElementById("cycleToggle"),
        focusMinutes: document.getElementById("focusMinutes"),
        breakMinutes: document.getElementById("breakMinutes"),
        focusMinus: document.getElementById("focusMinus"),
        focusPlus: document.getElementById("focusPlus"),
        breakMinus: document.getElementById("breakMinus"),
        breakPlus: document.getElementById("breakPlus"),
        focusSound: document.getElementById("focusSound"),
        breakSound: document.getElementById("breakSound"),
        addFocusSound: document.getElementById("addFocusSound"),
        addBreakSound: document.getElementById("addBreakSound"),
        clearAudio: document.getElementById("clearAudio"),
        fontStyle: document.getElementById("fontStyle"),
        soundInput: document.getElementById("soundInput"),
        backgroundSelect: document.getElementById("backgroundSelect"),
        uploadBackground: document.getElementById("uploadBackground"),
        resetBackground: document.getElementById("resetBackground"),
        backgroundInput: document.getElementById("backgroundInput"),
        tintSlider: document.getElementById("tintSlider"),
        tintValue: document.getElementById("tintValue"),
        toastStack: document.getElementById("toastStack"),
        timerTab: document.getElementById("timerTab"),
        appearanceTab: document.getElementById("appearanceTab"),
        historyTab: document.getElementById("historyTab"),
        timerPage: document.getElementById("timerPage"),
        appearancePage: document.getElementById("appearancePage"),
        historyPage: document.getElementById("historyPage"),
        timerSection: document.getElementById("timerSection"),
        appearanceSection: document.getElementById("appearanceSection"),
        historySection: document.getElementById("historySection"),
        weekHours: document.getElementById("weekHours"),
        weekSessions: document.getElementById("weekSessions"),
        historyList: document.getElementById("historyList"),
        copyHistoryJson: document.getElementById("copyHistoryJson"),
        clearHistory: document.getElementById("clearHistory")
      };

      const defaults = {
        mode: "focus",
        isRunning: false,
        cycleEnabled: true,
        focusMinutes: 25,
        breakMinutes: 5,
        selectedFocusSoundId: "soft-bell",
        selectedBreakSoundId: "gentle-ping",
        selectedBackgroundId: "mountain-lake",
        selectedFontStyle: "rounded",
        tint: 58,
        customSounds: [],
        customBackgrounds: [],
        history: []
      };

      const builtInSounds = [
        { id: "soft-bell", name: "Soft Bell", kind: "generated" },
        { id: "gentle-ping", name: "Gentle Ping", kind: "generated" }
      ];

      const builtInBackgrounds = [
        { id: "mountain-lake", name: "Mountain Lake", value: DEFAULT_BACKGROUND },
        { id: "aurora", name: "Aurora", value: "linear-gradient(135deg, rgba(20,184,166,.72), rgba(30,64,175,.52) 43%, rgba(88,28,135,.62))" },
        { id: "midnight", name: "Midnight", value: "linear-gradient(145deg, rgba(15,23,42,.94), rgba(14,116,144,.44) 48%, rgba(49,46,129,.68))" }
      ];

      const fontStyles = [
        {
          id: "rounded",
          name: "SF Rounded",
          appFont: '"SF Pro Rounded", "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif',
          timerFont: '"SF Pro Rounded", "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif'
        },
        {
          id: "balanced",
          name: "Avenir + DIN",
          appFont: '"Avenir Next", "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif',
          timerFont: '"DIN Alternate", "Avenir Next Condensed", "SF Pro Display", sans-serif'
        },
        {
          id: "editorial",
          name: "New York",
          appFont: '"New York", "Iowan Old Style", Georgia, serif',
          timerFont: '"New York", "Iowan Old Style", Georgia, serif'
        },
        {
          id: "geometric",
          name: "Futura",
          appFont: 'Futura, "Avenir Next", "SF Pro Display", sans-serif',
          timerFont: 'Futura, "Avenir Next Condensed", "SF Pro Display", sans-serif'
        },
        {
          id: "technical",
          name: "DIN Timer",
          appFont: '"Avenir Next", "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif',
          timerFont: '"DIN Alternate", "DIN Condensed", "SF Mono", monospace'
        },
        {
          id: "mono",
          name: "Menlo",
          appFont: 'Menlo, Monaco, "SF Mono", monospace',
          timerFont: 'Menlo, Monaco, "SF Mono", monospace'
        }
      ];

      let state = loadState();
      let selectedSoundTarget = "focus";
      let remainingSeconds = Number(state.remainingSeconds) || getModeDurationSeconds(state.mode);
      let timerId = null;
      let targetEndTime = 0;

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          return { ...defaults, ...saved };
        } catch {
          return { ...defaults };
        }
      }

      function saveState() {
        const restSeconds = state.isRunning ? Math.max(0, Math.ceil((targetEndTime - Date.now()) / 1000)) : remainingSeconds;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, isRunning: false, remainingSeconds: restSeconds }));
        } catch {
          showToast("Could not save settings");
        }
      }

      function getModeDurationSeconds(mode) {
        return Math.max(1, Number(mode === "focus" ? state.focusMinutes : state.breakMinutes) || 1) * 60;
      }

      function clampMinutes(value, fallback) {
        const parsed = Number.parseInt(value, 10);
        if (!Number.isFinite(parsed)) return fallback;
        return Math.min(180, Math.max(1, parsed));
      }

      function formatTime(totalSeconds) {
        const safe = Math.max(0, Math.ceil(totalSeconds));
        const minutes = Math.floor(safe / 60).toString().padStart(2, "0");
        const seconds = (safe % 60).toString().padStart(2, "0");
        return `${minutes}:${seconds}`;
      }

      function render() {
        const duration = getModeDurationSeconds(state.mode);
        const progress = duration > 0 ? Math.max(0, Math.min(100, (remainingSeconds / duration) * 100)) : 0;
        const settingsOpen = !state.isRunning || state.settingsOpen;

        elements.timerDisplay.textContent = formatTime(remainingSeconds);
        elements.durationLabel.textContent = formatTime(duration);
        elements.shell.style.setProperty("--progress", `${progress}%`);
        elements.shell.style.setProperty("--tint", String(state.tint / 100));
        elements.app.classList.toggle("focus-mode", !settingsOpen);
        elements.settingsButton.classList.toggle("active", settingsOpen && state.isRunning);
        elements.focusModeButton.classList.toggle("active", state.mode === "focus");
        elements.breakModeButton.classList.toggle("active", state.mode === "break");
        elements.cycleToggle.classList.toggle("on", state.cycleEnabled);
        elements.cycleToggle.setAttribute("aria-pressed", String(state.cycleEnabled));
        elements.focusMinutes.value = state.focusMinutes;
        elements.breakMinutes.value = state.breakMinutes;
        elements.tintSlider.value = state.tint;
        elements.tintValue.textContent = `${state.tint}%`;
        elements.fontStyle.value = state.selectedFontStyle;
        elements.focusSound.value = state.selectedFocusSoundId;
        elements.breakSound.value = state.selectedBreakSoundId;
        elements.backgroundSelect.value = state.selectedBackgroundId;
        applyFontStyle();
        applyBackground();
        renderHistory();
      }

      function renderSelects() {
        const allSounds = [...builtInSounds, ...state.customSounds];
        const allBackgrounds = [...builtInBackgrounds, ...state.customBackgrounds];

        for (const select of [elements.focusSound, elements.breakSound]) {
          select.innerHTML = "";
          for (const sound of allSounds) {
            const option = document.createElement("option");
            option.value = sound.id;
            option.textContent = sound.name;
            select.appendChild(option);
          }
        }

        elements.backgroundSelect.innerHTML = "";
        for (const background of allBackgrounds) {
          const option = document.createElement("option");
          option.value = background.id;
          option.textContent = background.name;
          elements.backgroundSelect.appendChild(option);
        }

        elements.fontStyle.innerHTML = "";
        for (const style of fontStyles) {
          const option = document.createElement("option");
          option.value = style.id;
          option.textContent = style.name;
          elements.fontStyle.appendChild(option);
        }
      }

      function applyBackground() {
        const background = [...builtInBackgrounds, ...state.customBackgrounds].find((item) => item.id === state.selectedBackgroundId) || builtInBackgrounds[0];
        const value = background.data ? `url("${background.data}")` : background.value;
        elements.shell.style.setProperty("--background-image", value);
      }

      function applyFontStyle() {
        const style = fontStyles.find((item) => item.id === state.selectedFontStyle) || fontStyles[0];
        document.documentElement.style.setProperty("--app-font", style.appFont);
        document.documentElement.style.setProperty("--timer-font", style.timerFont);
      }

      function setMode(mode, resetTime = true) {
        state.mode = mode;
        if (resetTime) {
          remainingSeconds = getModeDurationSeconds(mode);
          if (state.isRunning) targetEndTime = Date.now() + remainingSeconds * 1000;
        }
        saveState();
        render();
      }

      function startTimer() {
        if (state.isRunning) return;
        state.isRunning = true;
        state.settingsOpen = false;
        targetEndTime = Date.now() + remainingSeconds * 1000;
        timerId = window.setInterval(tick, 250);
        tick();
      }

      function pauseTimer() {
        if (!state.isRunning) return;
        remainingSeconds = Math.max(0, Math.ceil((targetEndTime - Date.now()) / 1000));
        state.isRunning = false;
        state.settingsOpen = true;
        clearInterval(timerId);
        timerId = null;
        saveState();
        render();
      }

      function resetTimer() {
        state.isRunning = false;
        state.settingsOpen = true;
        clearInterval(timerId);
        timerId = null;
        remainingSeconds = getModeDurationSeconds(state.mode);
        saveState();
        render();
      }

      function tick() {
        remainingSeconds = Math.max(0, Math.ceil((targetEndTime - Date.now()) / 1000));
        render();
        if (remainingSeconds <= 0) completeTimer();
      }

      function completeTimer() {
        const completedMode = state.mode;
        const completedSeconds = getModeDurationSeconds(completedMode);
        clearInterval(timerId);
        timerId = null;
        state.isRunning = false;
        if (completedMode === "focus") recordFocusSession(completedSeconds);
        playSelectedSound(completedMode);
        showToast(completedMode === "focus" ? "Focus complete" : "Break complete");

        if (state.cycleEnabled) {
          state.mode = completedMode === "focus" ? "break" : "focus";
          remainingSeconds = getModeDurationSeconds(state.mode);
          state.settingsOpen = false;
          render();
          window.setTimeout(() => {
            if (!state.isRunning && state.cycleEnabled) startTimer();
          }, 1000);
        } else {
          state.settingsOpen = true;
          remainingSeconds = getModeDurationSeconds(state.mode);
          saveState();
          render();
        }
      }

      function playSelectedSound(mode) {
        const soundId = mode === "focus" ? state.selectedFocusSoundId : state.selectedBreakSoundId;
        const custom = state.customSounds.find((sound) => sound.id === soundId);
        if (custom) {
          const audio = new Audio(custom.data);
          audio.volume = 0.78;
          audio.play().catch(() => showToast("Tap once to enable audio"));
          return;
        }
        playGeneratedChime(soundId);
      }

      function playGeneratedChime(kind) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) {
          showToast("Audio unavailable");
          return;
        }

        const ctx = new AudioContext();
        const now = ctx.currentTime;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(kind === "gentle-ping" ? 0.18 : 0.24, now + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.12);
        gain.connect(ctx.destination);

        const notes = kind === "gentle-ping" ? [784, 1175] : [660, 990];
        notes.forEach((frequency, index) => {
          const osc = ctx.createOscillator();
          osc.type = "sine";
          osc.frequency.setValueAtTime(frequency, now + index * 0.045);
          osc.frequency.exponentialRampToValueAtTime(frequency * 0.72, now + 1.02);
          osc.connect(gain);
          osc.start(now + index * 0.045);
          osc.stop(now + 1.16);
        });

        window.setTimeout(() => ctx.close(), 1400);
      }

      function changeMinutes(kind, delta) {
        const key = kind === "focus" ? "focusMinutes" : "breakMinutes";
        state[key] = clampMinutes(Number(state[key]) + delta, kind === "focus" ? 25 : 5);
        if (state.mode === kind && !state.isRunning) remainingSeconds = getModeDurationSeconds(kind);
        saveState();
        render();
      }

      function uploadFile(file, kind) {
        if (!file) return;
        if (file.size > MAX_FILE_SIZE) {
          showToast("File too large");
          return;
        }

        const reader = new FileReader();
        reader.onload = () => {
          const id = `${kind}-${Date.now()}`;
          const name = file.name.replace(/\.[^/.]+$/, "").slice(0, 24) || "Custom";
          const data = String(reader.result);

          if (kind === "sound") {
            state.customSounds.push({ id, name, data });
            if (selectedSoundTarget === "focus") state.selectedFocusSoundId = id;
            else state.selectedBreakSoundId = id;
            showToast("Sound saved");
          } else {
            state.customBackgrounds.push({ id, name, data });
            state.selectedBackgroundId = id;
            showToast("Image saved");
          }

          renderSelects();
          saveState();
          render();
        };
        reader.onerror = () => showToast("Could not read file");
        reader.readAsDataURL(file);
      }

      function recordFocusSession(seconds) {
        state.history.push({
          completedAt: new Date().toISOString(),
          seconds
        });
        state.history = state.history.slice(-240);
        saveState();
      }

      function getLocalDateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function formatHistoryDay(key) {
        const date = new Date(`${key}T00:00:00`);
        return date.toLocaleDateString(undefined, {
          weekday: "short",
          month: "short",
          day: "numeric"
        });
      }

      function getWeeklyHistory() {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const days = [];
        for (let offset = 0; offset < 7; offset += 1) {
          const date = new Date(today);
          date.setDate(today.getDate() - offset);
          days.push({
            key: getLocalDateKey(date),
            sessions: 0,
            seconds: 0
          });
        }

        const byDay = new Map(days.map((day) => [day.key, day]));
        for (const item of state.history) {
          const completed = new Date(item.completedAt);
          if (Number.isNaN(completed.getTime())) continue;
          completed.setHours(0, 0, 0, 0);
          const ageDays = Math.round((today - completed) / 86400000);
          if (ageDays < 0 || ageDays > 6) continue;
          const key = getLocalDateKey(completed);
          const day = byDay.get(key);
          if (!day) continue;
          day.sessions += 1;
          day.seconds += Math.max(0, Number(item.seconds) || 0);
        }

        const totalSeconds = days.reduce((sum, day) => sum + day.seconds, 0);
        const totalSessions = days.reduce((sum, day) => sum + day.sessions, 0);
        return { days, totalSeconds, totalSessions };
      }

      function buildHistoryExport() {
        const weekly = getWeeklyHistory();
        return {
          exportedAt: new Date().toISOString(),
          pastWeek: {
            focusHours: Number((weekly.totalSeconds / 3600).toFixed(2)),
            sessions: weekly.totalSessions,
            days: weekly.days.map((day) => ({
              date: day.key,
              sessions: day.sessions,
              focusHours: Number((day.seconds / 3600).toFixed(2))
            }))
          },
          sessions: state.history.slice()
        };
      }

      function renderHistory() {
        const weekly = getWeeklyHistory();
        elements.weekHours.textContent = `${(weekly.totalSeconds / 3600).toFixed(1)}h`;
        elements.weekSessions.textContent = String(weekly.totalSessions);
        elements.historyList.innerHTML = "";

        for (const day of weekly.days) {
          const item = document.createElement("div");
          item.className = "history-item";

          const label = document.createElement("div");
          label.className = "history-day";
          label.textContent = formatHistoryDay(day.key);

          const meta = document.createElement("div");
          meta.className = "history-meta";
          const hours = (day.seconds / 3600).toFixed(1);
          meta.textContent = `${day.sessions}x · ${hours}h`;

          item.append(label, meta);
          elements.historyList.appendChild(item);
        }
      }

      async function copyHistoryJson() {
        const json = JSON.stringify(buildHistoryExport(), null, 2);
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(json);
          } else {
            const textArea = document.createElement("textarea");
            textArea.value = json;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand("copy");
            textArea.remove();
          }
          showToast("JSON copied");
        } catch {
          showToast("Could not copy JSON");
        }
      }

      function clearAudio() {
        state.customSounds = [];
        state.selectedFocusSoundId = "soft-bell";
        state.selectedBreakSoundId = "gentle-ping";
        renderSelects();
        saveState();
        render();
        showToast("Audio cleared");
      }

      function resetBackground() {
        state.customBackgrounds = [];
        state.selectedBackgroundId = "mountain-lake";
        state.selectedFontStyle = "rounded";
        state.tint = 58;
        renderSelects();
        saveState();
        render();
        showToast("Appearance reset");
      }

      function clearHistory() {
        state.history = [];
        saveState();
        render();
        showToast("History cleared");
      }

      function setActiveTab(tab) {
        elements.timerTab.classList.toggle("active", tab === "timer");
        elements.appearanceTab.classList.toggle("active", tab === "appearance");
        elements.historyTab.classList.toggle("active", tab === "history");
        elements.timerPage.classList.toggle("active", tab === "timer");
        elements.appearancePage.classList.toggle("active", tab === "appearance");
        elements.historyPage.classList.toggle("active", tab === "history");
        elements.settingsBody.scrollTop = 0;
      }

      function showToast(message) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        elements.toastStack.appendChild(toast);
        window.setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transform = "translateY(8px) scale(0.98)";
        }, 1900);
        window.setTimeout(() => toast.remove(), 2300);
      }

      function attachEvents() {
        elements.settingsButton.addEventListener("click", () => {
          state.settingsOpen = state.isRunning ? !state.settingsOpen : true;
          render();
        });

        elements.focusModeButton.addEventListener("click", () => setMode("focus", true));
        elements.breakModeButton.addEventListener("click", () => setMode("break", true));
        elements.playButton.addEventListener("click", startTimer);
        elements.pauseButton.addEventListener("click", pauseTimer);
        elements.resetButton.addEventListener("click", resetTimer);
        elements.cycleToggle.addEventListener("click", () => {
          state.cycleEnabled = !state.cycleEnabled;
          saveState();
          render();
        });

        elements.focusMinus.addEventListener("click", () => changeMinutes("focus", -1));
        elements.focusPlus.addEventListener("click", () => changeMinutes("focus", 1));
        elements.breakMinus.addEventListener("click", () => changeMinutes("break", -1));
        elements.breakPlus.addEventListener("click", () => changeMinutes("break", 1));
        elements.focusMinutes.addEventListener("change", () => {
          state.focusMinutes = clampMinutes(elements.focusMinutes.value, 25);
          if (state.mode === "focus" && !state.isRunning) remainingSeconds = getModeDurationSeconds("focus");
          saveState();
          render();
        });
        elements.breakMinutes.addEventListener("change", () => {
          state.breakMinutes = clampMinutes(elements.breakMinutes.value, 5);
          if (state.mode === "break" && !state.isRunning) remainingSeconds = getModeDurationSeconds("break");
          saveState();
          render();
        });

        elements.focusSound.addEventListener("change", () => {
          state.selectedFocusSoundId = elements.focusSound.value;
          saveState();
        });
        elements.breakSound.addEventListener("change", () => {
          state.selectedBreakSoundId = elements.breakSound.value;
          saveState();
        });
        elements.fontStyle.addEventListener("change", () => {
          state.selectedFontStyle = elements.fontStyle.value;
          saveState();
          render();
        });
        elements.addFocusSound.addEventListener("click", () => {
          selectedSoundTarget = "focus";
          elements.soundInput.click();
        });
        elements.addBreakSound.addEventListener("click", () => {
          selectedSoundTarget = "break";
          elements.soundInput.click();
        });
        elements.clearAudio.addEventListener("click", clearAudio);
        elements.soundInput.addEventListener("change", () => {
          uploadFile(elements.soundInput.files[0], "sound");
          elements.soundInput.value = "";
        });

        elements.backgroundSelect.addEventListener("change", () => {
          state.selectedBackgroundId = elements.backgroundSelect.value;
          saveState();
          render();
        });
        elements.uploadBackground.addEventListener("click", () => elements.backgroundInput.click());
        elements.resetBackground.addEventListener("click", resetBackground);
        elements.backgroundInput.addEventListener("change", () => {
          uploadFile(elements.backgroundInput.files[0], "background");
          elements.backgroundInput.value = "";
        });
        elements.tintSlider.addEventListener("input", () => {
          state.tint = Number(elements.tintSlider.value);
          render();
        });
        elements.tintSlider.addEventListener("change", saveState);

        elements.timerTab.addEventListener("click", () => {
          setActiveTab("timer");
        });
        elements.appearanceTab.addEventListener("click", () => {
          setActiveTab("appearance");
        });
        elements.historyTab.addEventListener("click", () => {
          setActiveTab("history");
        });
        elements.copyHistoryJson.addEventListener("click", copyHistoryJson);
        elements.clearHistory.addEventListener("click", clearHistory);

        window.addEventListener("beforeunload", saveState);
      }

      state.focusMinutes = clampMinutes(state.focusMinutes, 25);
      state.breakMinutes = clampMinutes(state.breakMinutes, 5);
      state.tint = Math.min(82, Math.max(25, Number(state.tint) || 58));
      if (!fontStyles.some((style) => style.id === state.selectedFontStyle)) state.selectedFontStyle = "rounded";
      state.customSounds = Array.isArray(state.customSounds) ? state.customSounds : [];
      state.customBackgrounds = Array.isArray(state.customBackgrounds) ? state.customBackgrounds : [];
      state.history = Array.isArray(state.history) ? state.history : [];
      state.settingsOpen = true;
      remainingSeconds = Math.min(remainingSeconds, getModeDurationSeconds(state.mode));

      renderSelects();
      attachEvents();
      render();
    })();
  </script>
</body>
</html>
